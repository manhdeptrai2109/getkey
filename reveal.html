<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Của Bạn</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title-glow">KEY CỦA BẠN</h1>
        <p class="subtitle">Copy key bên dưới và nhập vào app</p>

        <div class="check-result" id="key-box">
            <p style="color:#00ff7f; font-size:20px; font-weight:bold; word-break:break-all;" id="key">Đang tải...</p>
        </div>

        <div class="controls" style="margin-top:20px; justify-content:center;">
            <button id="btn-copy" style="background:#1e6f1e; padding:12px 30px; font-size:14px;">COPY KEY</button>
        </div>

        <div class="counter" style="text-align:center; margin-top:15px;">
            Key có hiệu lực <span style="color:#ff2b2b; font-weight:bold;">6 giờ</span> kể từ lần sử dụng đầu tiên.
        </div>
    </div>

    <script>
        // Chú thích: lấy token từ URL, gọi API verify-token để lấy key
        const API_VERIFY_TOKEN = "https://tmanhios.pretty-pilot.workers.dev/verify-token";

        const params = new URLSearchParams(location.search);
        const token = params.get("token");
        const keyEl = document.getElementById("key");
        const copyBtn = document.getElementById("btn-copy");
        let finalKey = "";

        async function verifyToken() {
            if (!token) {
                keyEl.textContent = "Token không hợp lệ";
                keyEl.style.color = "#ff2b2b";
                copyBtn.disabled = true;
                return;
            }
            try {
                const f = new FormData();
                f.append("token", token);
                const r = await fetch(API_VERIFY_TOKEN, { method: "POST", body: f });
                const j = await r.json();
                if (j.status === "success") {
                    finalKey = j.key;
                    keyEl.textContent = finalKey;
                    copyBtn.disabled = false;
                } else {
                    keyEl.textContent = "Token hết hạn hoặc không hợp lệ";
                    keyEl.style.color = "#ff2b2b";
                    copyBtn.disabled = true;
                }
            } catch (e) {
                keyEl.textContent = "Lỗi kết nối server";
                keyEl.style.color = "#ff2b2b";
                copyBtn.disabled = true;
            }
        }

        copyBtn.addEventListener("click", () => {
            if (!finalKey) return;
            navigator.clipboard.writeText(finalKey).then(() => {
                const old = copyBtn.textContent;
                copyBtn.textContent = "ĐÃ COPY";
                setTimeout(() => { copyBtn.textContent = old; }, 1500);
            });
        });

        verifyToken();
    </script>
</body>
</html>
